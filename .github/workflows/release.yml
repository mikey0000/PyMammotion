name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install dependencies
        run: uv sync --frozen
#      - name: Run tests
#        run: uv run pytest tests/

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      # The tag and the package version are compared after PEP 440 normalisation,
      # so v0.9.0-beta1, v0.9.0.b1 and v0.9.0b1 all match a 0.9.0b1 package.
      - name: Check package version matches tag
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          uv run python - "$TAG_VERSION" <<'EOF'
          import importlib.metadata, os, sys
          from packaging.version import InvalidVersion, Version

          package_version = Version(importlib.metadata.version("pymammotion"))
          try:
              tag_version = Version(sys.argv[1])
          except InvalidVersion:
              sys.exit(f"Tag version ({sys.argv[1]}) is not a valid PEP 440 version")
          if package_version != tag_version:
              sys.exit(f"Package version ({package_version}) does not match tag version ({tag_version})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"prerelease={str(package_version.is_prerelease).lower()}\n")
              fh.write(f"version={package_version}\n")
          EOF

      - name: Inject credentials
        run: |
          uv run python scripts/update_credentials.py \
            --app-key "${{ secrets.ALIYUN_APP_KEY }}" \
            --app-secret "${{ secrets.ALIYUN_APP_SECRET }}" \
            --oauth2-client-id "${{ secrets.MAMMOTION_OAUTH2_CLIENT_ID }}" \
            --oauth2-client-secret "${{ secrets.MAMMOTION_OAUTH2_CLIENT_SECRET }}"

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
