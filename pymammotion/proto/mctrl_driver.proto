syntax = "proto3";

enum CutterWorkMode {
  CUTTER_STANDARD = 0;
  CUTTER_ECONOMIC = 1;
  CUTTER_PERFORMANCE = 2;
}

enum CollectMotorState {
  COLLECT_CLOSE = 0;
  COLLECT_OPEN = 1;
  COLLECT_STUCK = 2;
  COLLECT_ABNORMAL = 3;
}

enum UnloadMotorState {
  UNLOAD_CLOSE = 0;
  UNLOAD_OPEN = 1;
  UNLOAD_STOP = 2;
  UNLOAD_RUNNING = 3;
}

enum DrvCtrlLink {
  DRV_CTRL_UNKNOW = 0;
  DRV_CTRL_BLE = 1;
  DRV_CTRL_IOT = 2;
  DRV_CTRL_LAN = 3;
}

enum DrvSessionCtrlResult {
  DRV_SESSION_CTRL_OK = 0;
  DRV_SESSION_CTRL_GENERAL_ERROR = 1;
  DRV_SESSION_CTRL_INVALID_PARAM = 2;
  DRV_SESSION_CTRL_SEQ_INVALID = 3;
  DRV_SESSION_CTRL_DELAY = 4;
  DRV_SESSION_CTRL_BURST = 5;
  DRV_SESSION_CTRL_TOKEN_EXPIRED = 6;
  DRV_SESSION_CTRL_TOKEN_INVALID = 7;
  DRV_SESSION_CTRL_OUT_OF_FENCE = 8;
  DRV_SESSION_CTRL_BLE_PREEMPT = 9;
  DRV_SESSION_CTRL_NO_LOC_MAX_MILEAGE = 10;
  DRV_SESSION_CTRL_FPV_STREAM_ERROR = 11;
}

enum DrvSessionExitReason {
  DRV_SESSION_EXIT_IDLE_TIMEOUT = 0;
  DRV_SESSION_EXIT_BLE_PREEMPT = 1;
  DRV_SESSION_EXIT_NEW_CFG = 2;
}

message DrvMotionCtrl {
  int32 setLinearSpeed = 1;
  int32 setAngularSpeed = 2;
  DrvCtrlLink channel = 3;
}

message DrvMotionCtrlTest {
  int32 setLinearSpeed = 1;
  int32 setAngularSpeed = 2;
  DrvCtrlLink channel = 3;
}

message DrvMotionCtrlAck {
  uint64 timestamp = 1;
  int32 is_drop = 2;
  uint64 delay_ms = 3;
}

message DrvKnifeHeight {
  int32 knifeHeight = 1;
}

message DrvSrSpeed {
  int32 rw = 1;
  float speed = 2;
}

message DrvKnifeStatus {
  int32 knife_status = 1;
}

message DrvKnifeChangeReport {
  int32 is_start = 1;
  int32 start_height = 2;
  int32 end_height = 3;
  int32 cur_height = 4;
}

message DrvCollectCtrlByHand {
  int32 collect_ctrl = 1;
  int32 unload_ctrl = 2;
}

message DrvMowCtrlByHand {
  int32 main_ctrl = 1;
  int32 cut_knife_ctrl = 2;
  int32 cut_knife_height = 3;
  float max_run_speed = 4;
  int32 edge_ctrl = 5;
}

message DrvBuzzEnable {
  int32 buzz_enable = 1;
}

message rtk_cfg_req_t {
  int32 cmd_length = 1;
  string cmd_req = 2;
}

message rtk_cfg_req_ack_t {
  int32 cmd_length = 1;
  string cmd_response = 2;
}

message rtk_sys_mask_query_t {
  uint32 sat_system = 1;
}

message rtk_sys_mask_query_ack_t {
  uint32 sat_system = 1;
  repeated uint32 system_mask_bits = 2;
}

message AppSetCutterWorkMode {
  int32 CutterMode = 1;
  int32 SetResult = 2;
}

message AppGetCutterWorkMode {
  int32 current_cutter_mode = 1;
  int32 current_cutter_rpm = 2;
  int32 QueryResult = 3;
}

// Session-based manual drive (token-authenticated joystick control).
message DrvSessionCtrlReq {
  uint32 ctrlSeq = 1;
  int32 setLinearSpeed = 2;
  int32 setAngularSpeed = 3;
  DrvCtrlLink channel = 4;
  uint64 appSendTsMs = 5;
  uint64 vehicleSendTsMs = 6;
  string token = 7;
}

message DrvSessionCtrlAck {
  uint32 ctrlSeq = 1;
  uint64 appSendTsMs = 2;
  uint64 vehicleSendTsMs = 3;
  DrvSessionCtrlResult result = 4;
  bool localizationValid = 5;
  float fenceExceedDistance = 6;
  uint32 measuredDelayMs = 7;
  int32 preemptAccount = 8;
}

message DrvSessionExitAppNfty {
  string token = 1;
  DrvCtrlLink channel = 2;
}

message DrvSessionExitNfty {
  DrvSessionExitReason reason = 1;
  int32 preemptAccount = 2;
}

message MctlDriver {
  oneof SubDrvMsg {
    DrvMotionCtrl todev_devmotion_ctrl = 1;
    DrvKnifeHeight todev_knife_height_set = 2;
    DrvSrSpeed bidire_speed_read_set = 3;
    DrvKnifeHeight bidire_knife_height_report = 4;
    DrvKnifeStatus toapp_knife_status = 5;
    DrvMowCtrlByHand mow_ctrl_by_hand = 6;
    rtk_cfg_req_t rtk_cfg_req = 7;
    rtk_cfg_req_ack_t rtk_cfg_req_ack = 8;
    rtk_sys_mask_query_t rtk_sys_mask_query = 9;
    rtk_sys_mask_query_ack_t rtk_sys_mask_query_ack = 10;
    DrvKnifeChangeReport toapp_knife_status_change = 11;
    DrvCollectCtrlByHand collect_ctrl_by_hand = 12;
    AppSetCutterWorkMode cutter_mode_ctrl_by_hand = 13;
    AppGetCutterWorkMode current_cutter_mode = 14;
    DrvMotionCtrlTest todev_devmotion_ctrl_test = 15;
    DrvMotionCtrlAck toapp_devmotion_ctrl_ack = 16;
    DrvBuzzEnable drv_buzz_enable = 17;
    DrvSessionCtrlReq todev_session_ctrl_req = 18;
    DrvSessionCtrlAck toapp_session_ctrl_ack = 19;
    DrvSessionExitAppNfty todev_session_exit_nfty = 20;
    DrvSessionExitNfty toapp_session_exit_nfty = 21;
  }
}
